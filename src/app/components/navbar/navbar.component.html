<nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center space-x-2" (click)="closeMenu()">
        <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-secondary-500 rounded-lg flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
        </div>
        <span class="font-display font-bold text-xl text-gray-900 dark:text-white">Recipe Manager</span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-1">
        <a
          *ngFor="let item of navigationItems"
          routerLink="{{ item.path }}"
          routerLinkActive="bg-primary-50 text-primary-700 dark:bg-primary-900/20 dark:text-primary-400"
          [routerLinkActiveOptions]="{ exact: item.path === '' || item.path === '/' }"
          class="flex items-center space-x-2 px-3 py-2 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
          (click)="closeMenu()"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIconPath(item.icon)"></path>
          </svg>
          <span>{{ item.label }}</span>
        </a>
      </div>

      <!-- Right Side Actions -->
      <div class="flex items-center space-x-2">
        <!-- Theme Toggle -->
        <button
          (click)="toggleTheme()"
          class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
          title="Toggle theme"
        >
          <svg *ngIf="!isDarkMode()" class="w-5 h-5 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
          <svg *ngIf="isDarkMode()" class="w-5 h-5 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
        </button>

        <!-- User menu (desktop) -->
        <div class="hidden md:flex items-center space-x-3 pl-2 border-l border-gray-200 dark:border-gray-700">
          <ng-container *ngIf="currentUser() as user; else guestLinksDesktop">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">{{ user.name }}</span>
            <button
              (click)="logout()"
              class="text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors"
            >
              Log out
            </button>
          </ng-container>
          <ng-template #guestLinksDesktop>
            <a routerLink="/login" class="text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">Sign in</a>
            <a routerLink="/register" class="btn-primary text-sm font-medium px-3 py-1.5 rounded-lg">Sign up</a>
          </ng-template>
        </div>

        <!-- Mobile Menu Button -->
        <button
          (click)="toggleMenu()"
          class="md:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
        >
          <svg class="w-6 h-6 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMenuOpen" class="md:hidden py-4 border-t border-gray-200 dark:border-gray-700">
      <div class="flex flex-col space-y-1">
        <a
          *ngFor="let item of navigationItems"
          routerLink="{{ item.path }}"
          routerLinkActive="bg-primary-50 text-primary-700 dark:bg-primary-900/20 dark:text-primary-400"
          [routerLinkActiveOptions]="{ exact: item.path === '' || item.path === '/' }"
          class="flex items-center space-x-3 px-4 py-3 rounded-lg text-base font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
          (click)="closeMenu()"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIconPath(item.icon)"></path>
          </svg>
          <span>{{ item.label }}</span>
        </a>
        <div class="px-4 py-3 border-t border-gray-200 dark:border-gray-700 mt-2">
          <div *ngIf="currentUser() as user; else guestLinksMobile" class="flex items-center justify-between">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">{{ user.name }}</span>
            <button
              (click)="logout()"
              class="text-sm font-medium text-primary-600 dark:text-primary-400"
            >
              Log out
            </button>
          </div>
          <ng-template #guestLinksMobile>
            <div class="flex items-center space-x-3">
              <a routerLink="/login" (click)="closeMenu()" class="text-sm font-medium text-gray-700 dark:text-gray-300">Sign in</a>
              <a routerLink="/register" (click)="closeMenu()" class="btn-primary text-sm font-medium px-3 py-1.5 rounded-lg">Sign up</a>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</nav>
