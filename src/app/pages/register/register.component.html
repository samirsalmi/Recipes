<div class="page flex min-h-[80vh] items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-between gap-3">
      <a routerLink="/" class="font-display text-3xl font-semibold text-primary">Mise</a>
      <app-language-switcher [compact]="true" />
    </div>
    <h1 class="page-title mt-6">{{ t('auth.cookTogether') }}</h1>
    <p class="mt-1 text-muted">{{ t('auth.registerIntro') }}</p>

    <form (ngSubmit)="submit()" class="mt-8 space-y-4">
      <div>
        <label class="label" for="reg-name">{{ t('auth.yourName') }}</label>
        <input id="reg-name" type="text" name="name" class="input" [(ngModel)]="name" required autocomplete="given-name" />
      </div>
      <div>
        <label class="label" for="reg-username">{{ t('auth.username') }}</label>
        <input id="reg-username" type="text" name="username" class="input" [(ngModel)]="username" required autocomplete="username" autocapitalize="none" />
        @if (usernameInvalid) {
          <p class="mt-1 text-xs text-accent">{{ t('auth.usernameInvalid') }}</p>
        }
      </div>
      <div>
        <label class="label" for="reg-password">{{ t('auth.password') }}</label>
        <input id="reg-password" type="password" name="password" class="input" [placeholder]="t('auth.passwordPlaceholder')" [(ngModel)]="password" required autocomplete="new-password" />
        @if (passwordTooShort) {
          <p class="mt-1 text-xs text-accent">{{ t('auth.passwordShort') }}</p>
        }
      </div>
      @if (errorMessage()) {
        <p class="text-sm text-accent" role="alert">{{ errorMessage() }}</p>
      }
      <button type="submit" class="btn-primary w-full" [disabled]="isSubmitting()">
        {{ isSubmitting() ? t('auth.creating') : t('common.createAccount') }}
      </button>
    </form>

    <p class="mt-6 text-sm text-muted">
      {{ t('auth.haveAccount') }}
      <a routerLink="/login" [queryParams]="returnUrl ? { returnUrl } : {}" class="font-semibold text-primary hover:underline">{{ t('common.signIn') }}</a>
    </p>
  </div>
</div>
