<div class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-12">
  <!-- Header -->
  <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 py-8 px-4">
    <div class="container mx-auto">
      <h1 class="font-display text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-2">
        My Favorites
      </h1>
      <p class="text-gray-600 dark:text-gray-400">
        {{ favoriteRecipes().length }} saved recipes
      </p>
    </div>
  </div>

  <div class="container mx-auto px-4 py-8">
    <!-- Results -->
    <div *ngIf="favoriteRecipes().length > 0"
         class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <app-recipe-card
        *ngFor="let recipe of favoriteRecipes()"
        [recipe]="recipe"
        [isFavorite]="true"
        [viewMode]="'grid'"
        (favoriteToggled)="onFavoriteToggled($event)"
        (addToMealPlan)="onAddToMealPlan($event)"
      ></app-recipe-card>
    </div>

    <!-- Empty State -->
    <div *ngIf="favoriteRecipes().length === 0" class="text-center py-16">
      <div class="w-24 h-24 mx-auto mb-6 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center">
        <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
        </svg>
      </div>
      <h3 class="font-display text-xl font-semibold text-gray-900 dark:text-white mb-2">
        No favorites yet
      </h3>
      <p class="text-gray-600 dark:text-gray-400 mb-6">
        Start saving recipes you love by clicking the heart icon
      </p>
      <button
        (click)="navigateToRecipes()"
        class="btn btn-primary"
      >
        Browse Recipes
      </button>
    </div>
  </div>
</div>
