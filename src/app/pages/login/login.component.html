<div class="page flex min-h-[80vh] items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-between gap-3">
      <a routerLink="/" class="font-display text-3xl font-semibold text-primary">Mise</a>
      <app-language-switcher [compact]="true" />
    </div>
    <h1 class="page-title mt-6">{{ t('auth.welcomeBack') }}</h1>
    <p class="mt-1 text-muted">{{ t('auth.loginIntro') }}</p>

    <form (ngSubmit)="submit()" class="mt-8 space-y-4">
      <div>
        <label class="label" for="login-username">{{ t('auth.username') }}</label>
        <input id="login-username" type="text" name="username" class="input" [(ngModel)]="username" required autocomplete="username" autocapitalize="none" />
      </div>
      <div>
        <label class="label" for="login-password">{{ t('auth.password') }}</label>
        <input id="login-password" type="password" name="password" class="input" [(ngModel)]="password" required autocomplete="current-password" />
      </div>
      @if (errorMessage()) {
        <p class="text-sm text-accent" role="alert">{{ errorMessage() }}</p>
      }
      <button type="submit" class="btn-primary w-full" [disabled]="isSubmitting()">
        {{ isSubmitting() ? t('auth.signingIn') : t('common.signIn') }}
      </button>
    </form>

    <p class="mt-6 text-sm text-muted">
      {{ t('auth.newHere') }}
      <a routerLink="/register" [queryParams]="returnUrl ? { returnUrl } : {}" class="font-semibold text-primary hover:underline">{{ t('common.createAccount') }}</a>
    </p>
  </div>
</div>
