<div class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-16">
  <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 py-8 px-4">
    <div class="container mx-auto max-w-5xl">
      <h1 class="font-display text-3xl font-bold text-gray-900 dark:text-white mb-2">My Recipes</h1>
      <p class="text-gray-600 dark:text-gray-400">Everything you've published or twisted, public or private.</p>
    </div>
  </div>

  <div class="container mx-auto max-w-5xl px-4 py-8">
    <p *ngIf="isLoading()" class="text-gray-500 dark:text-gray-400">Loading...</p>
    <p *ngIf="!isLoading() && recipes().length === 0" class="text-gray-500 dark:text-gray-400">
      You haven't added any recipes yet.
      <a routerLink="/add-recipe" class="text-primary-600 dark:text-primary-400 hover:underline">Add one</a>.
    </p>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div
        *ngFor="let recipe of recipes()"
        class="card p-4 flex flex-col gap-2"
      >
        <div class="flex items-start justify-between gap-2">
          <a [routerLink]="['/recipes', recipe.id]" class="font-semibold text-gray-900 dark:text-white hover:underline">
            {{ recipe.name }}
          </a>
          <span class="badge" [class.badge-primary]="recipe.isPublic" [class.badge-secondary]="!recipe.isPublic">
            {{ recipe.isPublic ? 'Public' : 'Private' }}
          </span>
        </div>
        <p *ngIf="recipe.parentRecipeId" class="text-xs text-gray-500 dark:text-gray-400">
          Twist of {{ parentName(recipe) || 'another recipe' }}
        </p>
        <p *ngIf="recipe.isOfficial" class="text-xs text-primary-600 dark:text-primary-400">Official</p>
        <div class="flex gap-2 mt-auto pt-2">
          <a [routerLink]="['/recipes', recipe.id, 'edit']" class="btn btn-secondary text-sm flex-1 text-center">Edit</a>
          <button (click)="toggleVisibility(recipe)" class="btn btn-secondary text-sm flex-1">
            {{ recipe.isPublic ? 'Make private' : 'Make public' }}
          </button>
          <button (click)="deleteRecipe(recipe)" class="btn text-red-600 dark:text-red-400 border border-red-300 dark:border-red-800 hover:bg-red-50 dark:hover:bg-red-900/20 text-sm" title="Delete">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
