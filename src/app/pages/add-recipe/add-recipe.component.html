<div class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-16">
  <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 py-8 px-4">
    <div class="container mx-auto max-w-3xl">
      <h1 class="font-display text-3xl font-bold text-gray-900 dark:text-white mb-2">Add a Recipe</h1>
      <p class="text-gray-600 dark:text-gray-400">Share one of your own dishes with a photo, ingredients, and steps. It's published for everyone to see right away - you can make it private any time from the recipe page.</p>
    </div>
  </div>

  <div class="container mx-auto max-w-3xl px-4 py-8">
    <app-recipe-form
      submitLabel="Publish Recipe"
      submittingLabel="Publishing..."
      [isSubmitting]="isSubmitting()"
      [errorMessage]="errorMessage()"
      (save)="submit($event)"
    ></app-recipe-form>
  </div>
</div>
