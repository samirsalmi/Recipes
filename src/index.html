<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mise</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Mise: plan the week together and always have an accurate, shared grocery list.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- First paint: set <html lang dir> from the saved language (same key as I18nService) before Angular boots. -->
  <script>
    (function () {
      try {
        var l = localStorage.getItem('mise_lang');
        if (l !== 'en' && l !== 'fr' && l !== 'ar') {
          var n = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
          l = String(n).toLowerCase().split('-')[0];
          if (l !== 'fr' && l !== 'ar') l = 'en';
        }
        var d = document.documentElement;
        d.lang = l;
        d.dir = l === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
