# Optional: docker alternative to the local dev cluster (both use port 5434, run only one)
# (see README). This compose file is an alternative for machines without it: a throwaway
# PostgreSQL on port 5434 (so it never clashes with a local server) plus Redis for the
# recipe cache (the API works without Redis).
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipe_manager
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: recipe_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
